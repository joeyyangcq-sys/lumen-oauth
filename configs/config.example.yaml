server:
  http_listen: ":9080"
  read_timeout: 10s
  write_timeout: 10s

logging:
  level: info
  format: json

observability:
  metrics_enabled: true
  metrics_path: /metrics

oauth:
  issuer: http://127.0.0.1:9080
  audience:
    - lumen-mcp
  signing_key: change-me
  access_token_ttl: 15m

dcr:
  iat_required: true
  initial_access_tokens:
    - local-dev-iat

invite:
  ttl: 24h

storage:
  driver: sqlite
  sqlite_path: ./data/oauth.db
